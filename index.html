<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Plicora</title>
<meta name="description" content="Plicora is a private multi-account mail app for iPhone and iPad.">
<style>
:root{--bg:#fff;--fg:#1b1d21;--muted:#5b616b;--line:#dfe2e7;--accent:#0a5fd0;--card:#f5f7fa}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--fg:#e8eaee;--muted:#a0a6b0;--line:#2b2e35;--accent:#7db3ff;--card:#1b1d22}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:46rem;margin:0 auto;padding:1.5rem 1.1rem 4rem}
nav{display:flex;gap:1rem;flex-wrap:wrap;padding:.8rem 1.1rem;border-bottom:1px solid var(--line);max-width:46rem;margin:0 auto}
nav a{color:var(--accent);text-decoration:none}
h1{font-size:1.9rem;line-height:1.25;margin:.5rem 0}
h2{font-size:1.25rem;margin:2.2rem 0 .6rem;padding-top:.4rem;border-top:1px solid var(--line)}
a{color:var(--accent)}
p,ul,ol{margin:.5rem 0}
li{margin:.3rem 0}
.meta{color:var(--muted);font-size:.9rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:.8rem 1rem;margin:1rem 0}
details{border:1px solid var(--line);border-radius:10px;padding:.2rem 1rem;margin:.6rem 0;background:var(--card)}
summary{cursor:pointer;font-weight:600;padding:.6rem 0}
details[open] summary{margin-bottom:.2rem}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--line);padding:.45rem .6rem;text-align:left;vertical-align:top}
th{background:var(--bg)}
.scroll{overflow-x:auto}
code{font:.9em ui-monospace,Menlo,monospace;background:var(--bg);padding:.1em .3em;border-radius:4px}
</style>
</head>
<body>
<nav><a href="privacy.html">Privacy</a><a href="support.html">Support</a><a href="support.html#impressum">Impressum</a></nav>
<main>
<h1>Plicora</h1>
<p>Private multi-account email for iPhone and iPad. Gmail, Outlook, iCloud, Yandex and more in one inbox. No ads, no analytics, no tracking. Your mail stays on your device.</p>
<p><a href="support.html">Support and FAQ</a> &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="support.html#impressum">Impressum</a></p>
<p class="meta">Contact: <a href="mailto:plicora@rodmeister.com">plicora@rodmeister.com</a></p>
</main>
</body>
</html>
